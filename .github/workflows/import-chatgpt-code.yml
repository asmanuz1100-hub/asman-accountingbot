name: Finish uploaded bot assets

on:
  push:
    branches: [main]
    paths:
      - .github/upload_ready

permissions:
  contents: write

jobs:
  finish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add bundled fonts and sample reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts samples
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf fonts/DejaVuSans.ttf
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf fonts/DejaVuSans-Bold.ttf
          pip install -r requirements.txt
          DEMO_OUTPUT=samples python demo_reports.py
          rm -f .github/upload_ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/DejaVuSans.ttf fonts/DejaVuSans-Bold.ttf samples .github/upload_ready
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add accounting bot fonts and sample reports"
          git push origin HEAD:main
