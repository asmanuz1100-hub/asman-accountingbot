name: Keep Render Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render service
        run: |
          echo "Pinging Render service..."
          curl -sS -L --max-time 90 -o /dev/null -w "HTTP %{http_code}\n" https://asman-accounting-ai-v2.onrender.com || true
