name: Validate Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: >-
          python -m py_compile
          start.py bot.py database.py excel_docs.py enhancements.py asaka_excel.py
          invoice_registry.py incoming_invoice_support.py menu_customization.py
          reconciliation_persistence.py reconciliation_saldo.py reconciliation_ui.py
          reconciliation_pdf_v2.py reset_once.py stable_reconciliation.py
          business_controls.py document_guard.py financial_report_pdf.py financial_pdf_ui.py
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:///ci-smoke.db
        run: python -c "import start; print('startup imports OK')"
