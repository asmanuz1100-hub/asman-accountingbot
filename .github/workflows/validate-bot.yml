name: Validate Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: >-
          python -m py_compile
          start.py bot.py database.py excel_docs.py enhancements.py asaka_excel.py
          invoice_registry.py incoming_invoice_support.py menu_customization.py
          reconciliation_persistence.py reconciliation_saldo.py reconciliation_ui.py
          reconciliation_pdf_v2.py reset_once.py stable_reconciliation.py
          business_controls.py document_guard.py financial_report_pdf.py financial_pdf_ui.py
          ledger.py ledger_ui.py report_design.py access_control.py permissions_control.py
          trial_control.py tenant_control.py admin_monitor.py admin_bot.py
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:///ci-smoke.db
        run: python -c "import start; import admin_bot; print('startup and admin imports OK')"
      - name: Financial PDF smoke test
        env:
          DATABASE_URL: sqlite:///ci-pdf.db
        run: python -c "import start; import financial_report_pdf as f; data=f.collect_financial_snapshot(); pdf=f.build_financial_report_pdf(data); assert len(pdf) > 1000; print('financial PDF OK', len(pdf))"

      - name: Accounting regression tests
        run: python -m unittest discover -s tests -v
