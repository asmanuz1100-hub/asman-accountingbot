services:
  - type: web
    name: asman-accounting-ai-v2
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m py_compile start.py bot.py database.py excel_docs.py enhancements.py asaka_excel.py invoice_registry.py incoming_invoice_support.py menu_customization.py reconciliation_persistence.py reconciliation_saldo.py reconciliation_ui.py reconciliation_pdf_v2.py reset_once.py stable_reconciliation.py
    startCommand: python start.py
    envVars:
      - key: RUN_MODE
        value: webhook
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asman-accounting-db-v2
          property: connectionString

databases:
  - name: asman-accounting-db-v2
    plan: free
    region: oregon
