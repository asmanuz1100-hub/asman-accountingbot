services:
  - type: web
    name: asman-accounting-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: RUN_MODE
        value: webhook
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
