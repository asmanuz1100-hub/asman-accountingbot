services:
  - type: web
    name: asman-accounting-ai-v2
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: RUN_MODE
        value: webhook
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asman-accounting-db-v2
          property: connectionString

databases:
  - name: asman-accounting-db-v2
    plan: free
    region: oregon
